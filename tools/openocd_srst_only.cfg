# 只驱动 FT2232 的 nSRST，不创建 target：用来在 MCU 卡死、无法 halt 时做一次硬件复位。
# 用法：
#   openocd -f tools/openocd_srst_only.cfg -c "init" -c "ftdi set_signal nSRST 0" -c "sleep 200" \
#           -c "ftdi set_signal nSRST 1" -c "shutdown"
#
# 与 SDK 的 probes/ft2232.cfg 的区别：把 nSRST 的 output-enable（0x0800）加进 layout_init，
# 原配置里 nSRST 只声明了信号但没使能输出，所以 reset 命令碰不到板子的复位线。

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010

# data: TCK/TMS/TDI 初始值保持 SDK 的一致；oe: 追加 nSRST(0x0800)
ftdi_layout_init 0x0208 0x0b0b
ftdi_layout_signal nTRST -data 0x0200 -noe 0x0400
ftdi_layout_signal nSRST -data 0x0100 -noe 0x0800
