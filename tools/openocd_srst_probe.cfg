# 探测 nSRST 是否真的连到 MCU：在 nSRST 释放/拉低两种状态下各读一次 IDCODE。
# 拉低时 IDCODE 变成全 1（TAP 被复位），说明复位线是通的。

adapter driver ftdi
ftdi vid_pid 0x0403 0x6010
# oe 只加 nSRST(0x0800)，不驱动 nTRST(0x0400)：拉低 nTRST 会让 TAP 进复位，扫描全 1。
ftdi_layout_init 0x0208 0x080b
ftdi_layout_signal nTRST -data 0x0200 -noe 0x0400
ftdi_layout_signal nSRST -data 0x0100 -noe 0x0800
transport select jtag
adapter speed 1000

jtag newtap hpm cpu -irlen 5 -expected-id 0x1000563d
